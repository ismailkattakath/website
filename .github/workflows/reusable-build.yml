name: Build Application

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20.18.1'
      is-gh-pages:
        description: 'Whether this build is for GitHub Pages'
        type: boolean
        default: false
    secrets:
      PUBLIC_EDIT_PASSWORD_HASH:
        required: false

jobs:
  build:
    name: Astro Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: .astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.astro') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      - name: Create .nojekyll file
        if: ${{ inputs.is-gh-pages }}
        run: touch .nojekyll

      - name: Build with Astro
        run: npm run build
        env:
          PUBLIC_EDIT_PASSWORD_HASH: ${{ secrets.PUBLIC_EDIT_PASSWORD_HASH }}

      - name: Add .nojekyll to output
        if: ${{ inputs.is-gh-pages }}
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
