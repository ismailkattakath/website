name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manually re-run from the Actions tab to pull the latest Gist without a code change.
  # deploy-schedule.yml also fires this daily, so Gist-only edits reach the site.
  workflow_dispatch:
  # NO `schedule:` here, on purpose. "In a public repository, scheduled workflows
  # are automatically disabled when no repository activity has occurred in 60
  # days" (GitHub docs), and a disabled workflow loses EVERY trigger, push
  # included. On 2026-10-22 that left pushes to main with no run at all. The cron
  # lives in deploy-schedule.yml, so only the daily rebuild can lapse, never this.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  install:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project

  build:
    name: Build
    needs: install
    uses: ./.github/workflows/reusable-build.yml
    with:
      sync-markdown: true
      is-gh-pages: true
      RESUME_MD_GIST: ${{ vars.RESUME_MD_GIST }}
    secrets:
      NEXT_PUBLIC_EDIT_PASSWORD_HASH: ${{ secrets.NEXT_PUBLIC_EDIT_PASSWORD_HASH }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
