name: CI

# ONE REQUIRED CHECK: `gate` (shared, kattakath/.github). It always runs and asserts
# that every job it `needs` ended EXACTLY as this event expects, so a skipped job can
# never pass for a green one ("A job that is skipped will report its status as
# Success", GitHub docs). The suite runs on every PR here: this repo is owned by a
# personal account, so GitHub offers it no merge queue and QUEUE_ENABLED stays unset.
# No `push: main` leg: deploy.yml owns main and builds it there.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs; never cancel a queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE ONLY REQUIRED CHECK. Its job id is part of the ruleset; never rename it or
  # give it a `name:`.
  gate:
    if: ${{ !cancelled() }}
    needs: [install, typecheck, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # `expect` holds a deliberate SECOND copy of the suite's `if:`. If the two
      # copies drift, gate goes red, so a bad edit fails closed.
      - uses: kattakath/.github/actions/gate@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
        with:
          needs: ${{ toJSON(needs) }}
          expect: >-
            {"install": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "typecheck": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "test": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "build": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }}}

  install:
    name: Setup
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    needs: install
    runs-on: ubuntu-latest
    env:
      RESUME_JSON_GIST: ${{ vars.RESUME_JSON_GIST || 'https://gist.githubusercontent.com/ismailkattakath/5fc44006a632f8466f09b61749129a88/raw/resume.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Download resume data
        run: npm run download-resume-json

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Test Coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    needs: install
    runs-on: ubuntu-latest
    env:
      RESUME_JSON_GIST: ${{ vars.RESUME_JSON_GIST || 'https://gist.githubusercontent.com/ismailkattakath/5fc44006a632f8466f09b61749129a88/raw/resume.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Download resume data
        run: npm run download-resume-json

      - name: Run tests and collect coverage
        run: npm run test:coverage -- --cacheDirectory=.jest-cache --coverageThreshold='{}'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    needs: install
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      NEXT_PUBLIC_EDIT_PASSWORD_HASH: ${{ secrets.NEXT_PUBLIC_EDIT_PASSWORD_HASH }}
